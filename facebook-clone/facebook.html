<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Facebook – log in or sign up</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            color: #1c1e21;
        }

        .hero {
            margin-left: 80px;
        }

        .wrapper {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding-top: 100px;
            padding-right: 100px;
            gap: 50px;
        }

        .logo {
            width: 300px;
            margin-top: 80px;
            margin-left: -90px;
        }

        .tagline {
            font-size: 25px;
            margin-left: -60px;
            margin-top: -10px;
        }


        .login-panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 360px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            font-size: 1rem;
            border: 1px solid #dddfe2;
            border-radius: 6px;
        }

        input.input-field:focus {
            border-color: rgb(76, 76, 182);
            outline: 0px;
            caret-color: rgb(96, 96, 232);
        }

        .btn {
            display: block;
            padding: 12px 0;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-blue {
            width: 100%;
            background-color: #1877f2;
            color: #fff;
        }

        .btn-green {
            margin-left: 55px;
            width: 65%;
            background-color: #42b72a;
            color: #fff;
        }

        .forgot-link {
            font-size: 0.9rem;
            color: #1877f2;
            display: inline-block;
            text-decoration: none;
            margin-bottom: 20px;
        }

        a.forgot-link:hover {
            text-decoration: underline;
        }

        .page-link {
            font-size: 0.9rem;
            max-width: 360px;
            text-align: center;
        }

        .page-link a {
            color: black;
            font-weight: bold;
        }

        .page {
            text-decoration: none;
        }

        a.page:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    

    <div class="wrapper">
        <section class="hero">
            <img class="logo" src="https://static.xx.fbcdn.net/rsrc.php/y1/r/4lCu2zih0ca.svg" alt="logo">
            <p class="tagline">
                Facebook helps you connect and share <br> with the people in your life.
            </p>
        </section>
        <div class="right-group">
            <section class="login-panel">
                <form>
                    <input type="text" class="input-field" placeholder="Email address or phone number" required>
                    <input type="password" class="input-field" placeholder="Password" required>
                    <button type="submit" class="btn btn-blue">Log In</button>
                    <a href="https://www.facebook.com/login/identify/?ctx=recover&ars=facebook_login&from_login_screen=0"
                        class="forgot-link">Forgotten password?</a>
                </form>
                <hr><br>
                <button type="submit" class="btn btn-green">Create New
                    Account</button>
            </section>
            <br>
            <p class="page-link">
                <a class="page" href="https://www.facebook.com/pages/create/?ref_type=registration_form">Create a
                    Page</a> for a
                celebrity, brand or business.
            </p>
        </div>
    </div>
</body>

</html>
